# ============================================================================
# محیط توسعه Base44 — وب‌سایت میالویی (تک‌صفحه‌ای، بدون مرحله بیلد)
# ----------------------------------------------------------------------------
# این فایل فقط برای اجرا در سندباکس Base44 است و به کد سایت دست نمی‌زند.
# کد سایت از پوشه پروژه (bind mount) خوانده می‌شود، پس هر ویرایشی
# بلافاصله در پیش‌نمایش دیده می‌شود و نیازی به بیلد مجدد نیست.
# ============================================================================
services:
  web:
    image: node:22-alpine          # تصویر پایه عمومی (نه ایمیج آماده پروژه)
    working_dir: /app
    # نصب ابزار سرور محلی در شروع کار، سپس اجرای آن روی پورت ۳۰۰۰
    command:
      - sh
      - -ec
      - npm i -g live-server@1.2.2 >/dev/null 2>&1 && exec live-server --host=0.0.0.0 --port=3000 --no-browser --wait=150 --watch=/app /app
    ports:
      - "3000:3000"                # درگاه نمایش پیش‌نمایش
    volumes:
      - ./:/app                    # کد از همین ریپازیتوری خوانده می‌شود
    restart: on-failure
    healthcheck:
      # توجه: از 127.0.0.1 استفاده می‌شود چون «localhost» داخل کانتینر به IPv6 (::1)
      # می‌رود و سرور فقط روی IPv4 گوش می‌دهد.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
